upstream mrmf_storefront {
  server storefront:3000;
}

upstream mrmf_backend {
  server backend:9000;
}

# Conservative per-IP rate limits. The general zone covers normal browsing
# (Next.js page loads burst 15-25 asset requests); the POST zone exists to
# curb the junk-bot Server Action probes staging receives, while staying
# loose enough for notify-me submissions and future cart API calls.
limit_req_zone $binary_remote_addr zone=mrmf_general:10m rate=10r/s;

map $request_method $mrmf_post_limit_key {
  default "";
  POST $binary_remote_addr;
}

limit_req_zone $mrmf_post_limit_key zone=mrmf_post:10m rate=1r/s;

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # IP-only staging must never be indexed. Remove when this config is adapted
  # for the production domain.
  add_header X-Robots-Tag "noindex, nofollow" always;

  limit_req_status 429;

  # Staging is not for crawlers; the storefront has no robots route of its
  # own, so answer here at the proxy.
  location = /robots.txt {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location = /health {
    proxy_pass http://mrmf_backend/health;
  }

  location /store/ {
    limit_req zone=mrmf_general burst=30 nodelay;
    limit_req zone=mrmf_post burst=10 nodelay;
    proxy_pass http://mrmf_backend;
  }

  location / {
    limit_req zone=mrmf_general burst=30 nodelay;
    limit_req zone=mrmf_post burst=5 nodelay;
    proxy_pass http://mrmf_storefront;
  }
}
